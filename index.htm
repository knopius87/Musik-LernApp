function startNoteRound(roundId){
  const r=NOTE_ROUNDS.find(x=>x.id===roundId),pool=POOL[r.pool];
  const count=r.finale?14:(r.mix?10:8);
  const qs=[];let bag=[];
  for(let i=0;i<count;i++){if(!bag.length)bag=shuffle(pool.slice());
    const note=bag.pop();const dir=r.mix?r.dirs[Math.random()*r.dirs.length|0]:r.dirs[0];qs.push({dir,note});}
  nt={round:r,pool,kb:kbRange(pool),qs,i:0,correct:0,gained:0,locked:false};sessionMs=new Set();go("noteRound");
}
function focusKb(midi,b,octaves){
  octaves=octaves||2;const span=octaves*12;
  if(b[1]-b[0]<=span)return [b[0],b[1]];
  let baseC=midi-(((midi%12)+12)%12);
  let lo=(octaves===1)?baseC:(Math.random()<0.5?baseC-12:baseC),hi=lo+span;
  if(lo<b[0]){lo=b[0];hi=lo+span;}
  if(hi>b[1]){hi=b[1];lo=hi-span;}
  if(lo<b[0])lo=b[0];
  return [lo,hi];
}
function renderNoteRound(){
  const q=nt.qs[nt.i];nt.target=q.note;nt.dir=q.dir;nt.locked=false;
  const mob=window.matchMedia&&window.matchMedia("(max-width:520px)").matches;
  const win=focusKb(q.note.midi,nt.kb,mob?1:2),lo=win[0],hi=win[1];let prompt,answer;
  switch(q.dir){
    case "noteName":prompt=notePanel(staffSVG(q.note));answer=nameOptsHTML(q.note,nt.pool);break;
    case "nameNote":prompt=notePanel(`<div class="bigname">${escHtml(q.note.name)}</div>`);answer=staffOptsHTML(q.note,nt.pool,false);break;
    case "nameKey":prompt=notePanel(`<div class="bigname">${escHtml(q.note.name)}</div>`);answer=`<div id="ntans">${keyboardHTML(lo,hi,{clickable:true})}</div>`;break;
    case "keyName":prompt=notePanel(keyboardHTML(lo,hi,{highlight:q.note.midi}),"kbwrap");answer=nameOptsHTML(q.note,nt.pool);break;
    case "noteKey":prompt=notePanel(staffSVG(q.note));answer=`<div id="ntans">${keyboardHTML(lo,hi,{clickable:true})}</div>`;break;
    case "keyNote":prompt=notePanel(keyboardHTML(lo,hi,{highlight:q.note.midi}),"kbwrap");answer=staffOptsHTML(q.note,nt.pool,true);break;
  }
  $("app").innerHTML=`<div class="screen">
    <button class="backlink" onclick="if(confirm('Runde abbrechen? Gesammelte XP bleiben erhalten.'))go('noteHome')">‹ Abbrechen</button>
    <div class="qtop"><div class="qn">${escHtml(nt.round.label)}</div><div class="qtrack"><div class="qfill" style="width:${nt.i/nt.qs.length*100}%"></div></div><div class="qn">${nt.i+1}/${nt.qs.length}</div></div>
    <div class="qcard"><div class="qkind"><span class="tt">Noten-Trainer</span>${streak>=2?`<span style="color:var(--rose)">🔥 Serie ${streak}</span>`:""}</div>
      <div class="qtext">${DIR_LABEL[q.dir]}</div>
      ${prompt}${answer}
      <div class="feedback" id="fb"></div><div class="qfoot" id="foot"></div></div></div>`;
  setTimeout(()=>{const sc=document.querySelector(".kbdscroll");if(sc){const hl=sc.querySelector(".hl");if(hl)sc.scrollLeft=hl.offsetLeft-sc.clientWidth/2+hl.offsetWidth/2;}},0);
}
function noteAnsName(el){if(nt.locked)return;judgeNote(el,{name:el.getAttribute("data-name")});}
function noteAnsKey(el){if(nt.locked)return;judgeNote(el,{midi:+el.getAttribute("data-midi")});}
function noteAnsNote(el){if(nt.locked)return;judgeNote(el,{id:el.getAttribute("data-id"),midi:+el.getAttribute("data-midi")});}
function judgeNote(el,sel){
  nt.locked=true;const t=nt.target,dir=nt.dir;
  let ok;
  if(dir==="noteName"||dir==="keyName")ok=sel.name===t.name;
  else if(dir==="nameNote")ok=sel.id===t.id;
  else ok=sel.midi===t.midi; // nameKey, noteKey, keyNote
  document.querySelectorAll("#ntans [data-name],#ntans [data-midi],#ntans [data-id]").forEach(b=>{
    b.disabled=true;let c;
    if(b.hasAttribute("data-name"))c=b.getAttribute("data-name")===t.name;
    else if(dir==="nameNote")c=b.getAttribute("data-id")===t.id;
    else c=(+b.getAttribute("data-midi"))===t.midi;
    if(c)b.classList.add("correct");
  });
  if(!ok)el.classList.add("wrong");
  const gain=applyScore(ok,t.acc!==0?16:12);
  if(ok){nt.correct++;nt.gained+=gain;}
  const fb=$("fb");fb.className="feedback show "+(ok?"ok":"no");
  const hint=(dir==="keyName"&&t.enh.length>1)?` (auch: ${escHtml(t.enh[1])})`:"";
  fb.innerHTML=`<div class="fh"><span>${ok?"✓ Richtig!":"✗ Nicht ganz"}</span>${ok?`<span class="xp">+${gain} XP</span>`:""}</div><div class="sol">Richtig ist: <b>${escHtml(t.name)}</b>${hint}.</div>`;
  $("foot").innerHTML=`<button class="btn" onclick="nextNote()">${nt.i>=nt.qs.length-1?"Auswertung ›":"Weiter ›"}</button>`;
}
function nextNote(){nt.i++;if(nt.i>=nt.qs.length)finishNote();else go("noteRound");}
function finishNote(){
  const n=nt.qs.length,c=nt.correct,pct=c/n,p=Math.round(pct*100);
  if(!state.noteProgress)state.noteProgress={};
  const prev=state.noteProgress[nt.round.id]||{best:0};
  state.noteProgress[nt.round.id]={done:true,best:Math.max(prev.best||0,pct)};saveProgress();
  const passed=pct>=MASTERY-1e-9;
  const idx=NOTE_ROUNDS.findIndex(r=>r.id===nt.round.id),nextR=NOTE_ROUNDS[idx+1];
  let medal,msg;
  if(p>=95){medal="🏆";msg="Perfekt!";}else if(passed){medal="🥇";msg="Bestanden!";}else if(p>=50){medal="🎖️";msg="Fast geschafft!";}else{medal="🎵";msg="Weiter üben!";}
  if(nt.round.finale&&passed)fx.mega(15);
  const status=passed
    ?`<div class="ed-note" style="border-color:rgba(95,230,166,.55);background:rgba(95,230,166,.1)">✅ Bestanden (${Math.round(MASTERY*100)}% erreicht)! ${nextR?"Die nächste Runde ist freigeschaltet.":"Du hast den Noten-Trainer komplett gemeistert! 🎉"}</div>`
    :`<div class="ed-note" style="border-color:rgba(255,213,107,.55);background:rgba(255,213,107,.08)">Noch nicht freigeschaltet – du brauchst mindestens <b>${Math.round(MASTERY*100)}%</b>. Versuch es gleich nochmal!</div>`;
  $("app").innerHTML=`<div class="screen result"><div class="medal">${medal}</div><h2>${msg}</h2>
    <div class="sub">${escHtml(nt.round.label)}: ${c} von ${n} richtig (${p}%)</div>
    ${status}
    <div class="rgrid"><div class="box"><div class="v">+${nt.gained}</div><div class="l">XP diese Runde</div></div>
      <div class="box"><div class="v">${state.xp}</div><div class="l">XP gesamt</div></div>
      <div class="box"><div class="v">${state.bestStreak}</div><div class="l">Beste Serie</div></div></div>
    <div class="result-actions">
      <button class="btn" onclick="startNoteRound('${nt.round.id}')">↻ Wiederholen</button>
      ${(passed&&nextR)?`<button class="btn ghost" onclick="startNoteRound('${nextR.id}')">Nächste Runde ›</button>`:""}
      <button class="btn ghost" onclick="go('noteHome')">Übersicht</button></div></div>`;
}
initPools();
