<!DOCTYPE html>
<html lang="de"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musik Klasse 9 — Lern-App (mit Editor)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#070611;--bg1:#0c0a1f;--bg2:#120e2b;
  --ink:#f3f0ff;--muted:#a9a7d4;--dim:#7d7aac;
  --c1:#5ee7ff;--c2:#a98bff;--c3:#ff7ad9;--c4:#ffd56b;--c5:#7dffc4;--c6:#ff9e6b;
  --green:#5fe6a6;--red:#ff7a9c;--gold:#ffd56b;--rose:#ff7ad9;
  --glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.10);--lineHot:rgba(169,139,255,.55);
  --shadow:0 26px 70px -22px rgba(0,0,0,.75);
  --display:"Bricolage Grotesque",-apple-system,system-ui,sans-serif;
  --sans:"Plus Jakarta Sans",-apple-system,system-ui,sans-serif;
  --holo:linear-gradient(100deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5),var(--c1));
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--sans);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;
  background:var(--bg0);position:relative;overflow-x:hidden;
}
/* drifting aurora */
body::before{content:"";position:fixed;inset:-20%;z-index:-2;pointer-events:none;
  background:
    radial-gradient(38% 50% at 18% 18%, rgba(94,231,255,.22), transparent 60%),
    radial-gradient(42% 55% at 85% 12%, rgba(255,122,217,.20), transparent 60%),
    radial-gradient(50% 60% at 75% 88%, rgba(169,139,255,.24), transparent 62%),
    radial-gradient(46% 55% at 10% 92%, rgba(125,255,196,.16), transparent 60%),
    linear-gradient(160deg,var(--bg0),var(--bg1) 55%,var(--bg2));
  filter:saturate(1.1);animation:drift 26s ease-in-out infinite alternate;}
@keyframes drift{from{transform:translate3d(-2%,-1%,0) scale(1.02)}to{transform:translate3d(2%,2%,0) scale(1.06)}}
/* fine grain */
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
.wrap{max-width:860px;margin:0 auto;padding:18px 18px 90px}
button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:var(--sans)}
canvas#fx{position:fixed;inset:0;z-index:55;pointer-events:none}

/* shimmering, changing text */
.shimmer{background:var(--holo);background-size:280% 100%;-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;animation:shimmer 7s linear infinite}
@keyframes shimmer{to{background-position:280% 0}}

.topbar{position:sticky;top:0;z-index:30;backdrop-filter:blur(18px) saturate(1.2);
  background:linear-gradient(180deg,rgba(10,8,24,.86),rgba(10,8,24,.4));
  border-bottom:1px solid var(--line);margin:-18px -18px 24px;padding:14px 18px 13px;}
.brand{display:flex;align-items:center;gap:11px;justify-content:space-between;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:11px}
.logo .note{width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center;font-size:21px;color:#0a0820;
  background:var(--holo);background-size:200% 100%;animation:shimmer 6s linear infinite;
  box-shadow:0 8px 24px -6px rgba(169,139,255,.7), inset 0 0 12px rgba(255,255,255,.4)}
.logo h1{font-family:var(--display);font-weight:800;font-size:19px;line-height:1;background:var(--holo);background-size:280% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shimmer 7s linear infinite}
.logo h1 span{display:block;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--muted);-webkit-text-fill-color:var(--muted);background:none;font-family:var(--sans);font-weight:700;margin-top:4px;animation:none}
.stats{display:flex;align-items:center;gap:12px}
.stat{text-align:right;line-height:1}
.stat .v{font-family:var(--display);font-size:21px;font-weight:800;background:linear-gradient(120deg,var(--c4),var(--c6));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:4px}
.flame{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;padding:7px 12px;border-radius:30px;border:1px solid var(--lineHot);
  background:linear-gradient(120deg,rgba(255,122,217,.18),rgba(255,158,107,.14));box-shadow:0 0 18px -4px rgba(255,122,217,.5)}
.flame.cold{opacity:.45;border-color:var(--line);background:rgba(255,255,255,.05);box-shadow:none}
.rankbar{margin-top:14px}
.rankbar .row{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);margin-bottom:7px}
.rankbar .row b{color:var(--ink);font-weight:800;font-size:13px}
.track{height:11px;border-radius:20px;background:rgba(255,255,255,.07);overflow:hidden;border:1px solid rgba(255,255,255,.06);position:relative}
.fill{height:100%;border-radius:20px;background:var(--holo);background-size:280% 100%;animation:shimmer 5s linear infinite;
  transition:width .7s cubic-bezier(.2,.9,.2,1);box-shadow:0 0 16px rgba(169,139,255,.7)}

.screen{animation:rise .5s cubic-bezier(.2,.9,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.eyebrow{font-size:11px;letter-spacing:4px;text-transform:uppercase;font-weight:800;
  background:linear-gradient(110deg,var(--c1),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent}
h2.title{font-family:var(--display);font-weight:800;font-size:33px;line-height:1.05;margin:8px 0 6px;letter-spacing:-.5px;
  background:var(--holo);background-size:280% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shimmer 7s linear infinite}
.title.shimmer,h2.title{}
.lead{color:var(--muted);font-size:14.5px;line-height:1.6;max-width:62ch}

.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px;margin:26px 0}
@media(max-width:560px){.modes{grid-template-columns:1fr}}
.modecard{position:relative;text-align:left;border-radius:22px;padding:24px 22px;overflow:hidden;
  background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);
  backdrop-filter:blur(10px);transition:transform .28s,border-color .28s,box-shadow .28s;}
.modecard::before{content:"";position:absolute;inset:0;border-radius:22px;padding:1px;background:var(--holo);background-size:280% 100%;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:opacity .3s;animation:shimmer 6s linear infinite}
.modecard:hover{transform:translateY(-5px);box-shadow:0 34px 70px -24px rgba(94,231,255,.35)}
.modecard:hover::before{opacity:.9}
.modecard .ic{font-size:32px;margin-bottom:13px;display:block;filter:drop-shadow(0 4px 10px rgba(169,139,255,.5))}
.mlabel{display:inline-block;font-size:10px;letter-spacing:2.5px;text-transform:uppercase;font-weight:800;color:var(--c4);margin-bottom:5px}
.modecard h3{font-family:var(--display);font-size:22px;font-weight:800;margin-bottom:7px}
.modecard p{color:var(--muted);font-size:13px;line-height:1.55}
.modecard .glow{position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,rgba(169,139,255,.4),transparent 70%);pointer-events:none}

.section-h{display:flex;align-items:baseline;justify-content:space-between;margin:32px 0 15px;gap:10px}
.section-h h3{font-family:var(--display);font-size:19px;font-weight:700}
.section-h .hint{font-size:12px;color:var(--muted)}

.topics{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:12px}
.topic{display:flex;align-items:center;gap:12px;text-align:left;background:var(--glass);border:1px solid var(--line);
  border-radius:16px;padding:14px;transition:.22s;backdrop-filter:blur(8px)}
.topic:hover{transform:translateY(-3px);border-color:var(--lineHot);background:var(--glass2);box-shadow:0 18px 40px -20px rgba(169,139,255,.6)}
.topic.all{grid-column:1/-1;background:linear-gradient(110deg,rgba(94,231,255,.14),rgba(255,122,217,.12));border-color:var(--lineHot)}
.topic .ic{font-size:23px;flex:none;filter:drop-shadow(0 3px 8px rgba(0,0,0,.4))}
.topic .tx{line-height:1.2}
.topic .tx b{font-weight:800;font-size:14px}
.topic .tx small{display:block;color:var(--muted);font-size:11px;margin-top:3px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:30px;padding:14px 26px;font-weight:800;font-size:14px;letter-spacing:.2px;
  color:#0a0820;background:var(--holo);background-size:220% 100%;animation:shimmer 6s linear infinite;
  box-shadow:0 12px 30px -10px rgba(169,139,255,.7), inset 0 0 14px rgba(255,255,255,.35);transition:transform .16s,filter .2s;}
.btn:hover{transform:translateY(-2px) scale(1.02);filter:brightness(1.07)}
.btn:active{transform:translateY(0) scale(.99)}
.btn.ghost{background:var(--glass2);color:var(--ink);border:1px solid var(--line);box-shadow:none;animation:none}
.btn.ghost:hover{background:rgba(255,255,255,.12);border-color:var(--lineHot)}
.btn.sm{padding:10px 17px;font-size:12.5px}
.btn.danger{background:linear-gradient(120deg,#ff7a9c,#ff5e7e);color:#2a0610;animation:none;box-shadow:0 12px 30px -12px rgba(255,90,126,.7)}
.backlink{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:700;font-size:13px;margin-bottom:10px}
.backlink:hover{color:var(--c1)}

/* flashcards */
.fc-stage{perspective:1500px;margin:20px 0}
.fc{position:relative;width:100%;min-height:310px;cursor:pointer;transition:transform .65s cubic-bezier(.2,.9,.2,1);transform-style:preserve-3d;}
.fc.flipped{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:36px 32px;box-shadow:var(--shadow);overflow:hidden}
.fc-face::after{content:"";position:absolute;inset:0;border-radius:26px;padding:1.4px;background:var(--holo);background-size:280% 100%;animation:shimmer 7s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55}
.fc-front{background:linear-gradient(155deg,rgba(94,231,255,.10),rgba(169,139,255,.12)),var(--bg2)}
.fc-back{background:linear-gradient(155deg,rgba(255,122,217,.12),rgba(255,213,107,.08)),#1a1430;transform:rotateY(180deg)}
.fc-tag{position:absolute;top:18px;left:20px;font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:800;color:var(--c1)}
.fc-flip-hint{position:absolute;bottom:15px;right:20px;font-size:11px;color:var(--muted)}
.fc-front .term{font-family:var(--display);font-size:34px;font-weight:800;line-height:1.15;letter-spacing:-.5px}
.fc-back .def{font-size:17.5px;line-height:1.6;max-width:46ch}
.judge{display:flex;gap:12px;margin-top:16px}
.judge button{flex:1;border-radius:16px;padding:14px;font-weight:800;font-size:14px;border:1px solid transparent;transition:.18s}
.judge .again{background:rgba(255,122,156,.14);border-color:rgba(255,122,156,.4);color:#ffc0cd}
.judge .again:hover{background:rgba(255,122,156,.24);transform:translateY(-2px)}
.judge .know{background:rgba(95,230,166,.14);border-color:rgba(95,230,166,.4);color:#b6ffe0}
.judge .know:hover{background:rgba(95,230,166,.24);transform:translateY(-2px)}
.deckdone{text-align:center;padding:30px 10px}
.deckdone .big{font-family:var(--display);font-size:28px;font-weight:800;margin:8px 0;background:var(--holo);background-size:280% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shimmer 7s linear infinite}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.qtop .qtrack{flex:1;height:9px;border-radius:10px;background:rgba(255,255,255,.08);overflow:hidden}
.qtop .qfill{height:100%;background:var(--holo);background-size:280% 100%;animation:shimmer 5s linear infinite;transition:width .4s}
.qtop .qn{font-size:12px;color:var(--muted);font-weight:800;white-space:nowrap}
.qcard{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:26px 24px;box-shadow:var(--shadow);backdrop-filter:blur(12px);position:relative;overflow:hidden}
.qkind{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--c1)}
.qkind .tt{padding:3px 11px;border-radius:20px;background:rgba(94,231,255,.14);border:1px solid rgba(94,231,255,.3)}
.qtext{font-family:var(--display);font-size:23px;font-weight:700;line-height:1.32;margin-bottom:20px;letter-spacing:-.3px}
.opts{display:flex;flex-direction:column;gap:11px}
.opt{text-align:left;border-radius:15px;padding:15px 17px;font-size:15px;line-height:1.4;font-weight:600;background:var(--glass);border:1.5px solid var(--line);transition:.18s;display:flex;gap:12px;align-items:flex-start}
.opt .k{flex:none;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:800;background:rgba(255,255,255,.08);color:var(--muted)}
.opt:not(:disabled):hover{border-color:var(--lineHot);background:var(--glass2);transform:translateX(3px)}
.opt.correct{border-color:var(--green);background:rgba(95,230,166,.18);box-shadow:0 0 26px -6px rgba(95,230,166,.7);animation:pop .4s}
.opt.correct .k{background:var(--green);color:#06251a}
.opt.wrong{border-color:var(--red);background:rgba(255,122,156,.16)}
.opt.wrong .k{background:var(--red);color:#2a0610}
.opt:disabled{cursor:default}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
.fillbox{display:flex;gap:10px;flex-wrap:wrap}
.fillbox input{flex:1;min-width:200px;border-radius:15px;padding:15px 17px;font-size:16px;font-weight:600;background:var(--glass);border:1.5px solid var(--line);color:var(--ink);outline:none}
.fillbox input:focus{border-color:var(--c1);box-shadow:0 0 20px -6px rgba(94,231,255,.6)}
.fillbox input.correct{border-color:var(--green);background:rgba(95,230,166,.12)}
.fillbox input.wrong{border-color:var(--red);background:rgba(255,122,156,.12)}
.feedback{margin-top:18px;border-radius:16px;padding:15px 17px;font-size:14px;line-height:1.55;display:none}
.feedback.show{display:block;animation:rise .3s both}
.feedback.ok{background:rgba(95,230,166,.12);border:1px solid rgba(95,230,166,.35)}
.feedback.no{background:rgba(255,122,156,.1);border:1px solid rgba(255,122,156,.35)}
.feedback .fh{font-weight:800;margin-bottom:5px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.feedback .xp{font-size:13px;color:var(--gold);font-weight:800}
.feedback .sol b{color:var(--gold)}
.qfoot{display:flex;justify-content:flex-end;margin-top:18px}
.result{text-align:center;padding:16px 6px}
.medal{font-size:62px;margin-bottom:6px;filter:drop-shadow(0 8px 20px rgba(255,213,107,.5))}
.result h2{font-family:var(--display);font-size:32px;font-weight:800;margin-bottom:4px;background:var(--holo);background-size:280% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shimmer 7s linear infinite}
.result .sub{color:var(--muted);margin-bottom:24px}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:26px}
.rgrid .box{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:17px 10px;backdrop-filter:blur(8px)}
.rgrid .box .v{font-family:var(--display);font-size:28px;font-weight:800;background:linear-gradient(120deg,var(--c4),var(--c6));-webkit-background-clip:text;background-clip:text;color:transparent}
.rgrid .box .l{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);font-weight:800;margin-top:5px}
.result-actions{display:flex;gap:11px;justify-content:center;flex-wrap:wrap}

.xpfly{position:fixed;left:50%;top:30%;transform:translate(-50%,0);z-index:60;pointer-events:none;font-family:var(--display);font-weight:800;font-size:46px;
  background:linear-gradient(120deg,var(--c4),var(--c6),var(--c3));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 24px rgba(255,213,107,.7));animation:xpfly 1.15s cubic-bezier(.2,.9,.2,1) forwards}
@keyframes xpfly{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}25%{opacity:1;transform:translate(-50%,-12px) scale(1.12)}100%{opacity:0;transform:translate(-50%,-100px) scale(1)}}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:60;color:#0a0820;font-weight:800;font-size:14px;padding:14px 24px;border-radius:30px;
  background:var(--holo);background-size:220% 100%;animation:shimmer 6s linear infinite, toast 2.9s ease forwards;
  box-shadow:0 18px 44px -12px rgba(169,139,255,.8);display:flex;gap:9px;align-items:center}
@keyframes toast{0%{opacity:0;transform:translateX(-50%) translateY(22px) scale(.9)}10%,80%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(12px)}}
.screenflash{position:fixed;inset:0;z-index:54;pointer-events:none;animation:flash .65s ease forwards;
  background:radial-gradient(circle at 50% 45%,rgba(255,213,107,.35),rgba(169,139,255,.18) 40%,transparent 70%)}
@keyframes flash{0%{opacity:0}20%{opacity:1}100%{opacity:0}}

.ranks{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.rankline{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:16px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(6px)}
.rankline.cur{background:linear-gradient(110deg,rgba(94,231,255,.16),rgba(255,122,217,.12));border-color:var(--lineHot);box-shadow:0 0 26px -8px rgba(169,139,255,.7)}
.rankline.locked{opacity:.4}
.rankline .ic{font-size:23px;width:36px;text-align:center}
.rankline .nm{font-weight:800;flex:1}
.rankline .nm small{display:block;color:var(--muted);font-weight:600;font-size:11.5px;margin-top:2px}
.rankline .xp{font-family:var(--display);font-weight:800;color:var(--gold);font-size:15px}
.rankline .badge-cur{font-size:9.5px;font-weight:800;letter-spacing:1px;color:var(--c1);text-transform:uppercase}

/* editor */
.ed-note{background:rgba(94,231,255,.07);border:1px solid var(--line);border-radius:14px;padding:12px 15px;font-size:12.5px;color:var(--muted);line-height:1.55;margin:14px 0}
.ed-row{display:flex;align-items:center;gap:12px;background:var(--glass);border:1px solid var(--line);border-radius:15px;padding:13px 15px;margin-bottom:10px;backdrop-filter:blur(6px)}
.ed-row .ic{font-size:21px}
.ed-row .body{flex:1;min-width:0}
.ed-row .body b{font-weight:800;font-size:14px}
.ed-row .body small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.ed-row .acts{display:flex;gap:7px;flex:none}
.minibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:15px;background:var(--glass2);border:1px solid var(--line)}
.minibtn:hover{background:rgba(255,255,255,.14);border-color:var(--lineHot)}
.minibtn.del:hover{background:rgba(255,122,156,.25);border-color:var(--red)}
.ed-card{background:var(--glass);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:11px;position:relative;backdrop-filter:blur(6px)}
.ed-card .delx{position:absolute;top:10px;right:10px}
.field{margin-bottom:13px}
.field label{display:block;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:800;margin-bottom:7px;color:var(--c1)}
.field input[type=text],.field textarea,.field select,.inp{width:100%;border-radius:13px;padding:12px 14px;font-size:14.5px;font-weight:500;background:var(--glass);border:1.5px solid var(--line);color:var(--ink);outline:none;line-height:1.45}
.field input:focus,.field textarea:focus,.field select:focus,.inp:focus{border-color:var(--c1);box-shadow:0 0 18px -8px rgba(94,231,255,.6)}
.field textarea{min-height:66px;resize:vertical;font-family:var(--sans)}
.opt-edit{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.opt-edit input[type=radio]{width:21px;height:21px;accent-color:var(--c2);flex:none}
.opt-edit .inp{flex:1}
.opt-edit .rm{flex:none;width:36px;height:36px;border-radius:10px;background:rgba(255,122,156,.12);border:1px solid rgba(255,122,156,.3);color:#ffc0cd;font-size:15px}
.form-actions{display:flex;gap:11px;margin-top:6px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--glass);border:1px solid var(--line);border-radius:30px;padding:5px;gap:5px}
.seg button{padding:9px 17px;border-radius:30px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--holo);background-size:200% 100%;animation:shimmer 6s linear infinite;color:#0a0820}
.settings-grid{display:grid;gap:12px;margin-top:8px}
.set-card{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px;backdrop-filter:blur(6px)}
.set-card h4{font-size:14px;font-weight:800;margin-bottom:6px}
.set-card p{font-size:12px;color:var(--muted);line-height:1.55;margin-bottom:11px}
.switch{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700}
.switch input{width:21px;height:21px;accent-color:var(--c2)}
.gate{max-width:430px;margin:34px auto;text-align:center}
.gate .lock{font-size:50px;margin-bottom:8px;filter:drop-shadow(0 6px 16px rgba(169,139,255,.6))}
.gate input{text-align:center;letter-spacing:3px;margin:18px 0}

.footnote{margin-top:38px;text-align:center;color:var(--muted);font-size:11.5px;line-height:1.7}
.footnote button{color:var(--c3);text-decoration:underline;font-weight:700;font-size:11.5px}
.savechip{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:5px 11px;margin-top:10px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.dot.off{background:var(--red);box-shadow:0 0 8px var(--red)}

/* ===== Noten-Trainer ===== */
.note-step{cursor:pointer;transition:.2s}
.note-step:hover:not(.locked){transform:translateY(-2px);border-color:var(--lineHot)}
.note-step.locked{opacity:.5;cursor:default}
.np-go{font-size:13px;color:var(--c1);font-weight:800;flex:none}
.note-panel{display:flex;justify-content:center;align-items:center;padding:16px;margin-bottom:20px;background:rgba(0,0,0,.20);border:1px solid var(--line);border-radius:20px;min-height:124px}
.bigname{font-family:var(--display);font-size:86px;font-weight:800;line-height:1;background:var(--holo);background-size:280% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shimmer 7s linear infinite}
.staff{width:210px;max-width:72%;height:auto;display:block}
.stl{stroke:rgba(243,240,255,.85);stroke-width:1.4;stroke-linecap:round}
.stem{stroke:var(--ink);stroke-width:2.4;stroke-linecap:round}
.head{fill:var(--ink)}
.namepad{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.np{min-width:58px;flex:1 1 58px;max-width:92px;font-family:var(--display);font-size:26px;font-weight:800;padding:16px 0;border-radius:15px;background:var(--glass);border:1.6px solid var(--line);color:var(--ink);transition:.16s}
.np:hover:not(:disabled){border-color:var(--lineHot);transform:translateY(-2px);background:var(--glass2)}
.np:disabled{cursor:default}
.np.correct{border-color:var(--green);background:rgba(95,230,166,.2);box-shadow:0 0 22px -6px var(--green)}
.np.wrong{border-color:var(--red);background:rgba(255,122,156,.18)}
.kbd{position:relative;max-width:520px;margin:0 auto;width:100%;height:170px;user-select:none}
.wrow{display:flex;height:100%;gap:4px}
.wk{position:relative;flex:1;border:none;border-radius:0 0 10px 10px;background:linear-gradient(#fdfcff,#e9e5f6);box-shadow:0 7px 0 #c7c1de,inset 0 -10px 16px rgba(120,110,160,.12);transition:.1s}
.wk:hover:not(:disabled){background:linear-gradient(#ffffff,#ddd7f3)}
.wk:active:not(:disabled){transform:translateY(4px);box-shadow:0 3px 0 #c7c1de}
.wk:disabled{cursor:default}
.wk .kdot{position:absolute;left:50%;bottom:13px;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;background:transparent;transition:.15s}
.wk.hl{background:linear-gradient(#bfe9ff,#8ecbff);box-shadow:0 0 30px 3px var(--c1),0 7px 0 #6fa8d8}
.wk.hl .kdot{background:radial-gradient(circle,#1b6fb0,#0a4f88);box-shadow:0 0 10px #1b6fb0}
.wk.correct{background:linear-gradient(#b9ffe0,#73efbe);box-shadow:0 0 26px -4px var(--green),0 7px 0 #5cc79b}
.wk.wrong{background:linear-gradient(#ffcdd8,#ff95ac);box-shadow:0 0 22px -6px var(--red),0 7px 0 #d97189}
.brow{position:absolute;top:0;left:0;right:0;height:60%;pointer-events:none}
.bk{position:absolute;top:0;height:100%;background:linear-gradient(#3a3658,#0c0a18);border-radius:0 0 8px 8px;box-shadow:0 6px 0 #000,inset 0 -7px 9px rgba(255,255,255,.07)}
.staffopts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:440px;margin:0 auto}
.sopt{background:rgba(0,0,0,.2);border:1.6px solid var(--line);border-radius:16px;padding:6px;cursor:pointer;transition:.16s}
.sopt:hover:not(:disabled){border-color:var(--lineHot);transform:translateY(-3px)}
.sopt:disabled{cursor:default}
.sopt.correct{border-color:var(--green);box-shadow:0 0 24px -6px var(--green)}
.sopt.wrong{border-color:var(--red);box-shadow:0 0 20px -8px var(--red)}
.sopt .staff{width:100%;max-width:100%;height:auto}
@media(min-width:560px){.staffopts{grid-template-columns:repeat(4,1fr)}}
/* ===== Noten-Trainer: Erweiterungen (Tastatur scrollbar, schwarze Tasten klickbar, Vorzeichen) ===== */
.kbdscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:8px;max-width:100%}
.kbd{height:172px}
.wk{flex:1 0 38px;min-width:38px}
.brow{pointer-events:none}
.bk{pointer-events:auto;border:none;cursor:pointer}
.bk:disabled{cursor:default}
.bk:hover:not(:disabled){background:linear-gradient(#4a466e,#16132a)}
.bk:active:not(:disabled){transform:translateY(3px)}
.bk.hl{background:linear-gradient(#7fd0ff,#2f8fd6);box-shadow:0 0 26px 3px var(--c1),0 6px 0 #000}
.bk.correct{background:linear-gradient(#5fe6a6,#26b07d);box-shadow:0 0 24px -3px var(--green),0 6px 0 #000}
.bk.wrong{background:linear-gradient(#ff7a9c,#cf3f63);box-shadow:0 0 20px -5px var(--red),0 6px 0 #000}
.np{min-width:64px;max-width:140px;padding:14px 14px;font-size:23px}
.note-step .ic{min-width:26px;text-align:center;color:var(--c2);display:inline-flex;align-items:center;justify-content:center}
/* ===== Mobil: alles ohne Scrollen auf einen Smartphone-Screen ===== */
@media (max-width:520px){
  .wrap{padding:12px 12px 60px}
  .topbar{margin:-12px -12px 12px;padding:9px 12px 9px}
  .logo .note{width:32px;height:32px;font-size:17px;border-radius:10px}
  .logo h1{font-size:15px}
  .logo h1 span{font-size:8.5px;letter-spacing:2px;margin-top:3px}
  .stats{gap:9px}
  .stat .v{font-size:16px}.stat .l{font-size:8px}
  .flame{font-size:13px;padding:5px 9px}
  .rankbar{margin-top:9px}
  .rankbar .row{font-size:10.5px;margin-bottom:5px}
  .track{height:7px}
  h2.title{font-size:25px}
  .lead{font-size:13.5px}
  .backlink{margin-bottom:6px;font-size:12px}
  /* Frage-/Antwortkarte kompakt */
  .qtop{margin-bottom:10px}
  .qcard{padding:14px 13px;border-radius:18px}
  .qkind{margin-bottom:8px}
  .qtext{font-size:18px;line-height:1.25;margin-bottom:12px}
  .opts{gap:8px}
  .opt{padding:11px 13px;font-size:14px;border-radius:12px}
  .opt .k{width:22px;height:22px}
  .fillbox input{padding:12px 14px;font-size:15px}
  .feedback{margin-top:11px;padding:11px 13px;font-size:13px}
  .qfoot{margin-top:11px}
  .btn{padding:12px 20px;font-size:13.5px}
  /* Noten-Trainer */
  .note-panel{min-height:0;padding:8px;margin-bottom:11px}
  .note-panel .staff{width:auto;height:94px;max-width:100%}
  .bigname{font-size:52px}
  .namepad{gap:7px}
  .np{min-width:0;flex:1 1 0;max-width:none;padding:12px 4px;font-size:19px}
  /* Klaviatur an Bildschirmbreite anpassen – kein horizontales Scrollen */
  .kbdscroll{overflow-x:hidden}
  .kbd{min-width:0!important;height:118px}
  .wk{min-width:0;flex:1 1 0}
  .wk .kdot{width:9px;height:9px;bottom:9px}
  /* Notenauswahl: vier kleine Notenbilder nebeneinander */
  .staffopts{grid-template-columns:repeat(4,1fr);gap:7px;max-width:100%}
  .sopt{padding:4px}
  .sopt .staff{height:60px;width:auto;margin:0 auto;display:block}
  /* Karteikarten */
  .fc{min-height:228px}
  .fc-front .term{font-size:26px}
  .fc-back .def{font-size:15px}
  /* Ergebnis kompakt */
  .medal{font-size:46px}
  .result h2{font-size:25px}
  .rgrid{gap:8px;margin-bottom:16px}
  .rgrid .box{padding:12px 8px}
  .rgrid .box .v{font-size:22px}
}
/* sehr niedrige Screens zusätzlich straffen */
@media (max-width:520px) and (max-height:680px){
  .note-panel .staff{height:80px}
  .kbd{height:104px}
  .bigname{font-size:44px}
  .qtext{font-size:16.5px;margin-bottom:9px}
  .note-panel{margin-bottom:9px}
  .sopt .staff{height:54px}
}
</style>
</head>

<script id="seed" type="application/json">{"autoCards":true,"pwd":"musik","topics":[{"id":"film","name":"Filmmusik","icon":"🎬","cards":[{"term":"Was ist Filmmusik?","def":"Musik, die speziell für einen Film komponiert oder ausgewählt wird. Sie unterstützt die Handlung, verstärkt Emotionen und charakterisiert Figuren.","id":"cldrup4u"},{"term":"Was ist ein Leitmotiv?","def":"Ein wiederkehrendes musikalisches Thema für eine Figur, einen Ort oder eine Idee. Berühmte Leitmotive in der Filmmusik sind zum Beispiel die sich wiederholende 2-Ton-Figur aus \"Der Weiße Hai\" oder das Thema von Darth Vader aus \"Star Wars\" von John Williams.","id":"ctwydc2y"},{"term":"Was ist ein Soundtrack?","def":"Die gesamte Musik eines Films.","id":"coc18erm"},{"term":"Was ist ein Score?","def":"Die speziell für den Film komponierte Musik.","id":"c5ewbh5i"},{"term":"Was versteht man unter dem Begriff \"Diegetische Musik\"?","def":"Musik, die auch die Filmfiguren hören können (z. B. ein Radio im Film). Wir hören als Zuschauer*innen also dasselbe, was die Figuren im Film hören.","id":"c0fsesbo"},{"term":"Was versteht man unter dem Begriff \"Nicht-diegetische Musik\"?","def":"Musik, die nur das Publikum hört. Die Figuren im Film können diese Musik nicht hören.","id":"ccj8yxd4"},{"term":"Welche Emotionale Funktion erfüllt Filmmusik?","def":"Sie verstärkt Gefühle wie Freude, Spannung, Angst oder Trauer.","id":"c5jo0s71"},{"term":"Welche Dramaturgische Funktion erfüllt Filmmusik?","def":"Sie unterstützt den Aufbau der Handlung und leitet Höhe- oder Wendepunkte ein, unterstreicht wichtige Momente, erzeugt Spannung oder Entspannung.","id":"cytmyeov"},{"term":"Welche Charakterisierende Funktion kann Filmmusik erfüllen?","def":"Sie kann Figuren musikalisch beschreiben; Instrumente oder Melodien können für Charaktere stehen, z.B. durch bestimmte Leitmotive. Diese Leitmotive können sich auch verändern, je nach Stimmung der Figur.","id":"c6ytbcfj"},{"term":"Welche Atmosphärische Funktion kann Filmmusik erfüllen?","def":"Sie kann dafür genutzt werden, eine bestimmte Stimmung zu erzeugen. Diese kann die Stimmung der Szene unterstützen oder im Kontrast dazu stehen. ","id":"cw3ti19o"},{"term":"Welche Verbindende Funktion kann Filmmusik erfüllen?","def":"Sie kann helfen, verschiedene Szenen oder Teile eines Films miteinander zu verknüpfen.","id":"cu9fg0zt"},{"term":"Was weißt du über John Williams?","def":"Er ist der bekannteste Filmkomponist der Gegenwart, berühmt für starke Leitmotive (Star Wars, Harry Potter, Indiana Jones, Jurassic Park).","id":"ckk59f24"},{"term":"Was weißt du über Hans Zimmer?","def":"Auch ein sehr berühmter Komponist. Er verbindet Orchesterklänge mit elektronischer Musik (König der Löwen, Gladiator, Inception, Interstellar, Dune).","id":"ce4am198"},{"term":"Was weißt du über Ennio Morricone?","def":"Er  prägte den typischen Klang des Westernfilms (Spiel mir das Lied vom Tod).","id":"cu5a1zis"},{"term":"Was weißt du über Howard Shore?","def":"Ein berühmter Filmkomponist, berühmt für große Leitmotiv-Strukturen über mehrere Filme hinweg (Herr der Ringe, Hobbit).","id":"c55l7f4p"},{"term":"Was weißt du über Nino Rota?","def":"Ein italienischer Filmkomponist,  bekannt für berühmte Filmmelodien (Der Pate, La Dolce Vita).","id":"c4nx8y1m"},{"term":"Was weißt due über Bernard Herrmann?","def":"Ein berühmter Filmkomponist, der die legendären Streicherklänge in der Duschszene von 'Psycho' erschuf (ganz hohe Klänge, die rhythmisch pulsieren und die Szene erst spannend machen, die sonst sehr langweilig wäre).","id":"cst8jnc7"}],"questions":[{"type":"mc","q":"Wie nennt man Musik, die NUR das Publikum hört (nicht die Filmfiguren)?","options":["Diegetische Musik","Nicht-diegetische Musik","Leitmotiv","Score"],"answer":1,"ex":"Hört auch eine Filmfigur die Musik (z. B. ein Radio im Bild), ist sie diegetisch.","id":"qonbqmso"},{"type":"fill","q":"Ein wiederkehrendes musikalisches Thema für eine Figur, einen Ort oder eine Idee nennt man ___.","accept":["leitmotiv"],"sol":"Leitmotiv","ex":"","id":"qk0sdc4s"},{"type":"mc","q":"Wer komponierte die Filmmusik zu 'Star Wars'?","options":["Hans Zimmer","Ennio Morricone","John Williams","Howard Shore"],"answer":2,"ex":"John Williams ist berühmt für seine starken Leitmotive.","id":"qdbr3yvq"},{"type":"mc","q":"Welcher Komponist verbindet typischerweise Orchester mit elektronischer Musik (Inception, Interstellar)?","options":["John Williams","Hans Zimmer","Nino Rota","Bernard Herrmann"],"answer":1,"ex":"","id":"qw2wloy1"},{"type":"fill","q":"Die gesamte Musik eines Films wird als ___ bezeichnet.","accept":["soundtrack"],"sol":"Soundtrack","ex":"","id":"qojsifbr"}]},{"id":"video","name":"Musikvideos","icon":"📺","cards":[{"term":"Was ist eigentlich ein Musikvideo?","def":"Ein Film, der ein Musikstück visuell begleitet. So easy:)","id":"cghf2dse"},{"term":"Was versteht man unter einem Performance-Video?","def":"Die Künstler*innen treten auf und spielen das Lied, das ist dann der Inhalt des Musikvideos. Also die einfachste, direkteste Form.","id":"cwlrpi9w"},{"term":"Was versteht man unter einem Narrativen Video?","def":"Ein Musikvideo, das eine Geschichte erzählt. Die kann die Geschichte des Songs darstellen oder eine andere Geschichte, die einfach nur zur Stimmung der Musik passt.","id":"ctxuqijm"},{"term":"Was ist ein Konzeptvideo?","def":"Vermittelt Ideen oder Bilder ohne klare Handlung. Also da sag ich mal: K-POP und vor allem BTS","id":"cw3xwo0g"},{"term":"Was ist eine Mischform der Musikvideos?","def":"Kombination mehrerer Musikvideo-Formen.","id":"c740au7v"},{"term":"Nenne eine FunFact zu Thriller (M. Jackson)","def":"Revolutionierte das Musikvideo als Kunstform.","id":"c1uontoo"},{"term":"Nenne eine FunFact zu Video Killed the Radio Star","def":"Erstes Video, das je auf MTV lief (1981, The Buggles).","id":"c70haixn"},{"term":"Nenne ein FunFact zu Take On Me (a-ha)","def":"Berühmt für die Kombination aus Zeichentrick und Realfilm.","id":"cs64u60r"},{"term":"Nenne eine FunFact zu Gangnam Style (Psy)","def":"Erstes YouTube-Video mit über einer Milliarde Aufrufen.","id":"cmlgbxjc"},{"term":"Was  bedeutet der Begriff Kontrastwirkung?","def":"Musik und Bild widersprechen sich bewusst, statt sich zu ergänzen.","id":"cbna66pc"}],"questions":[{"type":"mc","q":"Welches gilt als das erste Video, das je auf MTV lief (1981)?","options":["Thriller","Take On Me","Video Killed the Radio Star","Gangnam Style"],"answer":2,"ex":"","id":"qk0020tl"},{"type":"mc","q":"Ein Musikvideo, in dem die Künstler*innen einfach das Lied spielen, ist ein …","options":["Konzeptvideo","Performance-Video","Narratives Video","Mischform"],"answer":1,"ex":"","id":"qi7afxcn"},{"type":"fill","q":"Ein Musikvideo, das eine Geschichte erzählt, nennt man ___ Video.","accept":["narratives","narrativ"],"sol":"narratives","ex":"","id":"qiysk690"}]},{"id":"sonate","name":"Sonate & SHF","icon":"🎹","cards":[{"term":"Was ist eine Sonate?","def":"Ein mehrsätziges Instrumentalwerk der Klassik, meist 3–4 Sätze, für Soloinstrument oder kleines Ensemble.","id":"cu55ss3e"},{"term":"Was ist eine Sonatenhauptsatzform?","def":"Die Form des ersten Satzes vieler Sonaten, Symphonien und Konzerte der Wiener Klassik und der Romantik.","id":"cqcoifhg"},{"term":"Was ist eine Exposition?","def":"So nennt man den ersten Teil der Sonatenhauptsatzform: die Vorstellung der Themen (Hauptthema, Überleitung, Seitenthema, Schlussgruppe). Diese wird meistens wiederholt.","id":"c0wwiz51"},{"term":"Was ist die Durchführung?","def":"Der zweiter Teil der Sonatenhauptsatzform: hier werden die Themen aus der Exposition verarbeitet, durch Modulationen und Spannungssteigerung.","id":"cx7b3vk2"},{"term":"Was ist die Reprise?","def":"So nennt man den dritten Teil der Sonatenhauptsatzform: Wiederkehr der Themen, beide nun in der Grundtonart.","id":"cltabb77"},{"term":"Was ist eine Coda?","def":"Der Schlussabschnitt der Sonatenhauptsatzform. Damit endet der Satz, meistens mit einem beeindruckenden Ende.","id":"cu2muc4u"},{"term":"Was ist ein musikalisches Thema?","def":"Ein musikalischer Grundgedanke.","id":"cf1mcfxv"},{"term":"Was ist die Tonika?","def":"Die Grundtonart eines Stückes. Bei einem Stück in C-Dur ist die Tonika C. Bei einem Stück in e-moll ist die Tonika e.","id":"cfllnwwn"},{"term":"Was ist die Dominante?","def":"Nicht die Grundtonart des Stücks, sondern die Tonart der fünften Stufe der Tonleiter. Bei einem Stück in C-Dur ist die Dominante G, bei einem Stück in e-moll ist die Dominante h.","id":"cmmv06jc"},{"term":"Was ist eine Modulation?","def":"Der Wechsel von der einen Tonart  in eine andere. Das ist eine Möglichkeit, um ein Stück interessant und spannend zu machen. Es gibt Modulationen, die unerwartet, also überraschend kommen. Das bringt Spannung in das Stück.","id":"c2lmfgyv"},{"term":"Was ist das Hauptthema in einem Sonatenhauptsatz?","def":"So nennt man das erstes Thema der Exposition, es steht in der Tonika.","id":"ch59mvu5"},{"term":"Was ist das Seitenthema in einem Sonatenhauptsatz?","def":"So nennt man das zweites Thema der Exposition, es steht in der Dominante oder  in der Paralleltonart.","id":"cwzotkjw"}],"questions":[{"type":"mc","q":"Welche Reihenfolge hat die Sonatenhauptsatzform?","options":["Exposition – Reprise – Durchführung – Coda","Durchführung – Exposition – Coda – Reprise","Exposition – Durchführung – Reprise – Coda","Reprise – Exposition – Durchführung – Coda"],"answer":2,"ex":"Erst werden die Themen vorgestellt, dann verarbeitet, dann wiederholt und schließlich abgerundet.","id":"qrjnb74n"},{"type":"fill","q":"In der Durchführung findet u. a. eine ___ statt – ein Wechsel in eine andere Tonart.","accept":["modulation"],"sol":"Modulation","ex":"","id":"q7paiqyp"},{"type":"mc","q":"In welcher Tonart steht das Hauptthema in der Exposition?","options":["Dominante","Tonika","Paralleltonart","Moll"],"answer":1,"ex":"","id":"q5zoe7gj"},{"type":"mc","q":"Was ist der Unterschied zwischen Sonate und Symphonie?","options":["Die Sonate ist für Orchester, die Symphonie für Soloinstrument","Die Sonate ist für Soloinstrument/kleines Ensemble, die Symphonie für großes Orchester","Beide sind dasselbe","Die Symphonie hat keine Sätze"],"answer":1,"ex":"","id":"qw00z6tb"}]},{"id":"symph","name":"Symphonie","icon":"🎻","cards":[{"term":"Was ist eine Symphonie / Sinfonie?","def":"Ein großes mehrsätziges Werk für Orchester, meist 4 Sätze; bedeutende Gattung der Wiener Klassik.","id":"cm2tyuen"},{"term":"Welche Instrumente gehören zu den Streichern? 4","def":"Instrumentengruppe: Violine, Viola, Violoncello, Kontrabass.","id":"cskffx6c"},{"term":"Holzbläser, nenne 4","def":"Instrumentengruppe: Flöte, Oboe, Klarinette, Fagott.","id":"chhu67s5"},{"term":"Blechbläser, nenne 4","def":"Instrumentengruppe: Trompete, Horn, Posaune, Tuba.","id":"cf80eah1"},{"term":"Schlagwerk, nenne 2","def":"Instrumentengruppe: Pauken und weitere Schlaginstrumente.","id":"c8pyzzzp"},{"term":"Was ist der typische Aufbau der Symphonie?","def":"1. schnell (Sonatenhauptsatzform), 2. langsam, 3. Menuett/Scherzo, 4. schnelles Finale.","id":"cmiqsmg7"},{"term":"Nenne ein FunFact zu Beethovens  5. Symphonie","def":"'Schicksalssymphonie' mit dem berühmten Motiv 'Ta-ta-ta-taaa'.","id":"crzkwa2u"},{"term":"Nenne ein FunFact zu Beethovens 9. Symphonie","def":"Erste Symphonie mit Chor; enthält die 'Ode an die Freude' (heute Europahymne).","id":"c7jfb1fq"},{"term":"Nenne ein FunFact zu Mozarts  40. Symphonie","def":"In g-Moll; eines der bekanntesten, ungewöhnlich dramatischen Werke Mozarts.","id":"c3zsad1f"},{"term":"Nenne ein FunFact zu Haydns  94. Symphonie, gennant \"die mit dem Paukenschlag'","def":"Berühmte Überraschungswirkung im langsamen Satz, nämlich... ein Paukenschlag, der alle erschreckt! (Vielleicht der erste Drop der Musikgeschichte?)","id":"cdlswnw0"},{"term":"Nenne ein offensichtliches Funfact zu Schuberts  'Unvollendete'","def":"8. Symphonie; nur zwei Sätze vollendet, trotzdem weltberühmt.","id":"cazv5u91"},{"term":"Nenne ein FunFact zu Dvořáks Symphonie  'Aus der Neuen Welt'","def":"9. Symphonie; verbindet europäische und amerikanische Einflüsse.","id":"cphlceix"},{"term":"Nenne ein FunFact zu Berlioz' Symphonie fantastique","def":"Frühes Meisterwerk der Programmmusik, total crazy im 4. Satz: die Streicher müssen teilweise die Bögen umdrehen und mit dem Holz auf den Saiten spielen! Im letzten Satz befinden wir uns nämlich in der Hölle und da geht es ab!","id":"cqo1vsw0"}],"questions":[{"type":"mc","q":"Welches Instrument gehört NICHT zu den Holzbläsern?","options":["Oboe","Klarinette","Trompete","Fagott"],"answer":2,"ex":"Die Trompete gehört zu den Blechbläsern.","id":"q8q4gi89"},{"type":"fill","q":"Beethovens 5. Symphonie trägt den Beinamen '___symphonie'.","accept":["schicksal","schicksals"],"sol":"Schicksal(s)","ex":"","id":"q9gi4kb9"},{"type":"mc","q":"Welche Symphonie enthält die 'Ode an die Freude' (heute Europahymne)?","options":["Mozarts 40.","Beethovens 9.","Schuberts 'Unvollendete'","Dvořáks 'Neue Welt'"],"answer":1,"ex":"","id":"qkouf2gr"},{"type":"mc","q":"Wie viele Sätze hat eine Symphonie typischerweise?","options":["2","3","4","6"],"answer":2,"ex":"","id":"qm0xdj03"}]},{"id":"barock","name":"Barock","icon":"⛪","cards":[{"term":"Was ist der Barock?","def":"Musikepoche ca. 1600–1750: prunkvolle Musik, Verzierungen, starke Kontraste, Generalbass.","id":"c5gsj31f"},{"term":"Was ist ein Generalbass (Basso continuo)?","def":"Eine durchgehende Bassbegleitung als Fundament der Musik. Hört man in jedem barocken Stück (war da Pflicht), in Form von Cembalo und Cello.","id":"cqpls1ve"},{"term":"Was versteht man unter Terrassendynamik?","def":"Plötzlicher Wechsel zwischen laut und leise (ohne allmähliche Übergänge). Denn im Barock wusste man noch nicht, wie man Übergänge machen kann: es gab nur laut oder leise im Wechsel.","id":"crek4y05"},{"term":"Was ist ein Oratorium?","def":"Ein geistliches Werk ohne szenische Darstellung, also eine Oper zu biblischen Texten. Die Kirche war streng, da durfte man nur Musik machen ohne Darstellung auf der Bühne.","id":"c9n3z12u"},{"term":"Was ist eine Fuge?","def":"Eine mehrstimmige Kompositionsform mit Imitationen, anders gesagt: ein Kanon in sehr kompliziert. ","id":"c9u7batw"},{"term":"Nenne 4 Komponisten des Barock","def":"Bach, Händel, Vivaldi, Purcell.","id":"co9cpjbu"},{"term":"Wer schrieb \"Die vier Jahreszeiten\"?","def":"Berühmtes Werk von Antonio Vivaldi.","id":"cimnzwhy"},{"term":"Wer schrieb die \"Brandenburgische Konzerte\"?","def":"Berühmtes Werk von Johann Sebastian Bach.","id":"ch3mjy9m"},{"term":"Wer schrieb den \"Messias\"?","def":"Berühmtes Oratorium von Georg Friedrich Händel. Das kennt ihr auch, zu 100%! Ich sag nur \"Haaallelujah, Haaallelujah, Hallelujah, Hallelujah, Halle-eelujaaaaah.\" ","id":"co8z371c"}],"questions":[{"type":"fill","q":"Die Epoche des Barock dauerte etwa von 1600 bis ___.","accept":["1750"],"sol":"1750","ex":"","id":"qzwcqi6w"},{"type":"mc","q":"Wodurch ist die Dynamik im Barock geprägt?","options":["Allmähliche Übergänge (Crescendo)","Terrassendynamik","Gleichbleibende Lautstärke","Zufällige Lautstärke"],"answer":1,"ex":"Terrassendynamik = plötzlicher Wechsel zwischen laut und leise.","id":"qzep5j4p"},{"type":"mc","q":"Welcher Begriff bezeichnet die durchgehende Bassbegleitung als Fundament der Barockmusik?","options":["Fuge","Oratorium","Generalbass","Terrassendynamik"],"answer":2,"ex":"","id":"qp7dizrw"},{"type":"mc","q":"Wer komponierte 'Die vier Jahreszeiten'?","options":["Bach","Vivaldi","Händel","Purcell"],"answer":1,"ex":"","id":"qmv11ojc"}]},{"id":"klassik","name":"Wiener Klassik","icon":"🏛️","cards":[{"term":"Was war die Wiener Klassik?","def":"Epoche ca. 1750–1820: Klarheit, Ausgewogenheit, regelmäßige Periodik, Sonatenhauptsatzform.","id":"ccun1kae"},{"term":"Nenne 3 Komponisten der Klassik","def":"Joseph Haydn, Wolfgang Amadeus Mozart, Ludwig van Beethoven.","id":"c6fji5l2"},{"term":"Was ist eine Periode in der Musik?","def":"Ein musikalischer Satz (=eine Melodie) bestehend aus Vordersatz und Nachsatz, z.B. Hänschen Klein.","id":"c0lsuy8g"},{"term":"Was ist ein Motiv?","def":"Die kleinste musikalische Sinneinheit, aus der man größere Teile machen kann. Das berühmteste Beispiel lautet \"ta-ta-ta-taaa\"","id":"cijvlisp"},{"term":"Was ist ein Thema in der Musik der Klassik?","def":"Eine größere musikalische Einheit bestehend aus mehreren Motiven.","id":"coi2sx6p"}],"questions":[{"type":"fill","q":"Die kleinste musikalische Sinneinheit nennt man ___.","accept":["motiv"],"sol":"Motiv","ex":"","id":"qz7ayf0o"},{"type":"mc","q":"Welche drei Komponisten zählen zur Wiener Klassik?","options":["Bach, Händel, Vivaldi","Haydn, Mozart, Beethoven","Schubert, Wagner, Chopin","Guetta, Avicii, Garrix"],"answer":1,"ex":"","id":"q01xd36g"}]},{"id":"romantik","name":"Romantik","icon":"🌙","cards":[{"term":"Was ist die Romantik?","def":"Epoche ca. 1820–1900: Betonung von Gefühlen und Fantasie, Naturverbundenheit, große Orchester, Programmmusik.","id":"cqg1tp3r"},{"term":"Was ist Programmmusik?","def":"Instrumentalmusik mit außermusikalischem Inhalt (Natur, Geschichten, Gedichte). D.h., dass mit Musik eine Handlung erzählt wird (Frühling, der Weg eines Flusses oder ein Sturm usw.) Die Musik hat also ein \"Programm\" = eine Handlung.","id":"cu9i1qen"},{"term":"Was versteht man unter dem Begriff \"Absolute Musik\"?","def":"Musik ohne konkrete Handlung oder Geschichte, im Gegensatz zur Programmmusik. Sie ist einfach nur Musik.","id":"crl3psya"},{"term":"Wer war Franz Schubert?","def":"Bedeutender Liedkomponist (Die Winterreise, Unvollendete Sinfonie).","id":"cs7m1bdj"},{"term":"Wer war Robert Schumann?","def":"Bedeutender Klavier- und Liedkomponist (Kinderszenen, Dichterliebe).","id":"cxfnt08r"},{"term":"Wer war Clara Schumann?","def":"Bedeutende Konzertpianistin und Förderin romantischer Musik.","id":"cjq1tdq5"},{"term":"Wer war Johannes Brahms?","def":"Verbindet romantische Ausdruckskraft mit klassischen Formen (4 Sinfonien, Kammermusik).","id":"cnowawqg"},{"term":"Wer war Richard Wagner?","def":"Er reformierte die Oper und entwickelte die Leitmotivtechnik weiter (Der Ring des Nibelungen).","id":"ce6bzo9w"},{"term":"Wer war Frédéric Chopin?","def":"Meister romantischer Klaviermusik (Nocturnes, Polonaisen, Etüden).","id":"cyb5xthd"},{"term":"Wer war Felix Mendelssohn Bartholdy?","def":"Vermittler zwischen Klassik und Romantik (Ein Sommernachtstraum). Aus dem Sommernachtstraum ist vor allem der Hochzeitsmarsch sehr berühmt (in jeder Filmhochzeit zu hören).","id":"cpwv2qxi"}],"questions":[{"type":"mc","q":"Wie nennt man Instrumentalmusik mit außermusikalischem Inhalt (z. B. einer Geschichte)?","options":["Absolute Musik","Programmmusik","Diegetische Musik","Generalbass"],"answer":1,"ex":"","id":"qli6ph0i"},{"type":"mc","q":"Welcher Komponist reformierte die Oper und entwickelte die Leitmotivtechnik weiter?","options":["Chopin","Brahms","Wagner","Schubert"],"answer":2,"ex":"","id":"q801gpgp"},{"type":"fill","q":"Die Romantik dauerte etwa von ___ bis 1900.","accept":["1820"],"sol":"1820","ex":"","id":"qk2b27wj"}]},{"id":"edm","name":"EDM","icon":"🎧","cards":[{"term":"Wofür steht die Abkürzung EDM?","def":"Sie ist ein Sammelbegriff für elektronische Tanzmusik (Electronic Dance Music), seit den 1980er Jahren.","id":"cpgu88sq"},{"term":"Was versteht man unter dem Begriff \"Beat\"?","def":"Der regelmäßige Grundschlag.","id":"cqr493j7"},{"term":"Was ist ein Loop?","def":"Ein sich wiederholender Klangabschnitt.","id":"cz1o9fqg"},{"term":"Wofür steht der Begriff \"Drop\"?","def":"Der Drop ist der Höhepunkt eines EDM-Stücks, oft nach einem Spannungsaufbau (Töne gehen nach oben, Rhythmus wird schneller, manchmal kommt eine kurze Stille, bevor der Beat gesteigert wieder einsetzt).","id":"c1raxkl5"},{"term":"Was ist ein Build-Up?","def":"Der Abschnitt vor dem Drop, der Spannung erzeugt.","id":"cpnq16f2"},{"term":"Was ist ein Synthesizer?","def":"Ein elektronisches Instrument zur Klangerzeugung.","id":"czhhooyo"},{"term":"Was versteht man unter einem Sample?","def":"Ein aufgenommener Klang, der weiterverarbeitet wird. Oft werden kurze Ausschnitte aus anderen Songs gesampelt, um sie in einem neuen Song anders einzusetzen.","id":"cbcz0ek5"},{"term":"Nenne 5 Stilrichtungen des EDM","def":"House, Techno, Trance, Dubstep, Future Bass.","id":"cb9iurnx"},{"term":"Nenne 4 bekannte EDM-Künstler","def":"David Guetta, Martin Garrix, Avicii, Calvin Harris.","id":"cz535f2r"}],"questions":[{"type":"fill","q":"Der Höhepunkt eines EDM-Stücks – oft nach einem Spannungsaufbau – heißt ___.","accept":["drop"],"sol":"Drop","ex":"","id":"q4cxzq7g"},{"type":"mc","q":"Was bezeichnet ein 'Loop' in der EDM?","options":["Den Höhepunkt des Songs","Einen sich wiederholenden Klangabschnitt","Ein elektronisches Instrument","Den Grundschlag"],"answer":1,"ex":"","id":"qz8g3wpw"},{"type":"mc","q":"Welche der folgenden ist KEINE typische EDM-Stilrichtung?","options":["House","Techno","Barock","Dubstep"],"answer":2,"ex":"","id":"q635ybmj"}]},{"id":"param","name":"Musikparameter","icon":"🎚️","cards":[{"term":"Was versteht man unter Tempo in der Musik?","def":"Das Tempo ist die Geschwindigkeit eines Musikstücks.","id":"cs5hv76t"},{"term":"Was bedeutet die Tempobezeichnung \"Largo\"?","def":"Tempobezeichnung: sehr langsam.","id":"c8a3uxf2"},{"term":"Was bedeutet die Tempobezeichnung \"Adagio\"?","def":"Tempobezeichnung: langsam.","id":"cf7wpi29"},{"term":"Was bedeutet die Tempobezeichnung \"Andante\"?","def":"Tempobezeichnung: gehend, also mittel, nicht zu schnell, nicht zu langsam.","id":"c4l8e436"},{"term":"Was bedeutet die Tempobezeichnung Moderato?","def":"Tempobezeichnung: mäßig. Denk an \"moderat\", also nicht zu schnell.","id":"co4tadhm"},{"term":"Was bedeutet die Tempobezeichnung \"Allegro\"?","def":"Tempobezeichnung: schnell.","id":"cdb16kxb"},{"term":"Was bedeutet die Tempobezeichnung \"Presto\"?","def":"Tempobezeichnung: sehr schnell.","id":"cs3i3s0c"},{"term":"Was bezeichnet man mit dem Begriff Dynamik in der Musik?","def":"Die Lautstärke in der Musik.","id":"c5a7wsgl"},{"term":"Was bedeutet die Lautstärke \"pp\" (pianissimo)?","def":"Dynamik: sehr leise.","id":"c4wuffvu"},{"term":"Was bedeutet die Lautstärke \"p\" (piano)?","def":"Dynamik: leise.","id":"c13h23g0"},{"term":"Was bedeutet die Lautstärke \"mf\"  (mezzoforte)?","def":"Dynamik: mittel laut.","id":"ctgiyt87"},{"term":"Was bedeutet die Lautstärke \"f\" (forte)?","def":"Dynamik: laut.","id":"crsrw2ax"},{"term":"Was bedeutet die Lautstärke \"ff\" (fortissimo)?","def":"Dynamik: sehr laut.","id":"cb1lb8oy"},{"term":"Was versteht man unter Tonhöhe?","def":"Wie hoch oder tief Töne klingen.","id":"cbx18p3v"},{"term":"Was bezeichnet man als Melodie?","def":"Eine Folge von Tönen mit erkennbarem Zusammenhang.","id":"cetanrwe"},{"term":"Was bezeichnet man als Rhythmus?","def":"Die zeitliche, meistens wiederkehrende Ordnung von sich abwechselnden Tönen und Pausen.","id":"cmkjkwyr"},{"term":"Was bezeichnet man als Harmonik?","def":"Der Zusammenklang mehrerer Töne. Meistens begleitet die Harmonik die Melodie.","id":"c2o07x1r"},{"term":"Was bezeichnet man als Konsonanz?","def":"Ein wohlklingender Zusammenklang (wirkt ruhig, harmonisch).","id":"cx830xh7"},{"term":"Was bezeichnet man als Dissonanz?","def":"Ein spannungsreicher Klang, der aus mehreren Tönen zusammengesetzt ist (wirkt unruhig, konfliktreich).","id":"ch3cv7jx"},{"term":"Was bezeichnet man als Klangfarbe?","def":"Der charakteristische Klang eines Instruments oder einer Stimme.","id":"cxetjvee"}],"questions":[{"type":"mc","q":"Was bedeutet die Tempobezeichnung 'Presto'?","options":["sehr langsam","gehend","mäßig","sehr schnell"],"answer":3,"ex":"","id":"qrt0vw12"},{"type":"fill","q":"'Largo' bedeutet sehr ___.","accept":["langsam"],"sol":"langsam","ex":"","id":"qhxem37q"},{"type":"mc","q":"Welche Dynamikangabe bedeutet 'sehr leise'?","options":["ff","mf","pp","f"],"answer":2,"ex":"","id":"qcq2ruwa"},{"type":"mc","q":"Welche Wirkung hat eine Dissonanz typischerweise?","options":["Ruhe und Harmonie","Spannung und Unruhe","Fröhlichkeit","Leichtigkeit"],"answer":1,"ex":"","id":"q8jtw1gp"},{"type":"mc","q":"Schnelles Tempo wirkt typischerweise …","options":["ruhig und traurig","aufregend und energiegeladen","geheimnisvoll","feierlich"],"answer":1,"ex":"","id":"qr2lobvs"},{"type":"mc","q":"Eine Tonart in Moll wirkt typischerweise …","options":["fröhlich und positiv","traurig und nachdenklich","kraftvoll und laut","schnell"],"answer":1,"ex":"","id":"qv4c7269"}]}]}</script>

<script>
/* ============================================================
   SPEICHER-SCHLÜSSEL
   ============================================================ */
const PKEY="musiktrainer_kl9_progress_v2"; // Lernfortschritt (XP, Karten)
const CKEY="musiktrainer_kl9_content_v2";  // Inhalte (editierbar)
const SEED_ORIGINAL=document.getElementById("seed").textContent;

/* ============================================================
   HELPERS
   ============================================================ */
const $=id=>document.getElementById(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const rid=()=>Math.random().toString(36).slice(2,9);
const escHtml=s=>(""+s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const escAttr=s=>escHtml(s).replace(/"/g,"&quot;");
function norm(s){return (""+s).toLowerCase().trim().replace(/[.,;:!?„“"']/g,"").replace(/\s+/g," ").replace(/^(der|die|das|ein|eine)\s+/,"");}
function toast(t){const e=document.createElement("div");e.className="toast";e.innerHTML="✨ "+t;document.body.appendChild(e);setTimeout(()=>e.remove(),2800);}
function flyXP(n){const e=document.createElement("div");e.className="xpfly";e.textContent="+"+n;document.body.appendChild(e);setTimeout(()=>e.remove(),1100);}

/* ============================================================
   FX – Konfetti & fliegende Münzen (steigert sich mit Streak)
   ============================================================ */
const fx=(()=>{
  const cv=document.getElementById("fx"),ctx=cv.getContext("2d");
  let W,H,DPR,parts=[],running=false;
  function resize(){DPR=Math.min(window.devicePixelRatio||1,2);cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;cv.style.width=innerWidth+"px";cv.style.height=innerHeight+"px";W=cv.width;H=cv.height;}
  addEventListener("resize",resize);resize();
  const COLORS=["#5ee7ff","#a98bff","#ff7ad9","#ffd56b","#7dffc4","#ff9e6b"];
  const rnd=(a,b)=>a+Math.random()*(b-a);
  function confetti(x,y,n,power){for(let i=0;i<n;i++){const a=rnd(0,Math.PI*2),sp=rnd(2,7)*power;
    parts.push({t:"c",x:x*DPR,y:y*DPR,vx:Math.cos(a)*sp*DPR,vy:(Math.sin(a)*sp-rnd(4,9)*power)*DPR,g:.22*DPR,w:rnd(6,12)*DPR,h:rnd(9,17)*DPR,rot:rnd(0,6),vr:rnd(-.34,.34),col:COLORS[Math.random()*COLORS.length|0],life:rnd(60,115),age:0,flip:rnd(0,6)});}}
  function coins(x,y,n,power){for(let i=0;i<n;i++){const a=rnd(-Math.PI*0.78,-Math.PI*0.22),sp=rnd(6,12)*power;
    parts.push({t:"m",x:x*DPR,y:y*DPR,vx:Math.cos(a)*sp*DPR,vy:Math.sin(a)*sp*DPR,g:.34*DPR,r:rnd(9,15)*DPR,vr:rnd(-.4,.4),life:rnd(75,125),age:0,phase:rnd(0,6)});}}
  function tick(){
    ctx.clearRect(0,0,W,H);
    for(const p of parts){
      p.age++;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;
      const alpha=Math.max(0,Math.min(1,(1-p.age/p.life)*1.7));
      if(p.t==="c"){p.rot+=p.vr;ctx.save();ctx.globalAlpha=alpha;ctx.translate(p.x,p.y);ctx.rotate(p.rot);
        ctx.scale(1,Math.cos(p.flip+p.age*.2));ctx.fillStyle=p.col;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();}
      else{const sx=Math.cos(p.phase+p.age*.26);ctx.save();ctx.globalAlpha=alpha;ctx.translate(p.x,p.y);ctx.scale(Math.abs(sx)*.85+.15,1);
        const g=ctx.createLinearGradient(-p.r,-p.r,p.r,p.r);g.addColorStop(0,"#fff3b8");g.addColorStop(.45,"#ffd24a");g.addColorStop(1,"#cf8a12");
        ctx.beginPath();ctx.arc(0,0,p.r,0,7);ctx.fillStyle=g;ctx.fill();
        ctx.lineWidth=Math.max(1,p.r*.16);ctx.strokeStyle="rgba(255,255,255,.75)";ctx.stroke();
        if(sx>0){ctx.fillStyle="rgba(168,105,8,.95)";ctx.font="bold "+(p.r*1.15)+"px serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("♪",0,1);}
        ctx.restore();}
    }
    parts=parts.filter(p=>p.age<p.life&&p.y<H+60*DPR);
    if(parts.length)requestAnimationFrame(tick);else{running=false;ctx.clearRect(0,0,W,H);}
  }
  function run(){if(!running){running=true;requestAnimationFrame(tick);}}
  return{
    burst(level){const L=Math.max(1,level||1),cx=innerWidth/2,cy=innerHeight*0.34,power=1+Math.min(L,12)*0.12;
      confetti(cx,cy,20+L*6,power);coins(cx,cy,3+L*2,power);

      if(L>=4)coins(innerWidth*0.5,innerHeight*0.5,L*2,power*0.9);
      run();},
    mega(level){const L=Math.max(5,level||5),power=1.4+Math.min(L,15)*0.05;flashFx();
      confetti(innerWidth*0.04,innerHeight*0.62,46,power);confetti(innerWidth*0.96,innerHeight*0.62,46,power);
      coins(innerWidth/2,innerHeight*0.55,18+L,power);
      for(let i=0;i<26+L;i++)parts.push({t:"m",x:rnd(0,innerWidth)*DPR,y:-rnd(0,220)*DPR,vx:rnd(-1,1)*DPR,vy:rnd(2,5)*DPR,g:.12*DPR,r:rnd(8,14)*DPR,vr:rnd(-.3,.3),life:rnd(95,160),age:0,phase:rnd(0,6)});
      run();}
  };
})();

/* gemeinsame Punktevergabe für Test & Noten-Trainer */
function applyScore(ok,baseXp){
  let gain=0;
  if(ok){
    streak++;const sb=Math.min(streak-1,10)*2;gain=baseXp+sb;
    state.xp+=gain;if(streak>state.bestStreak)state.bestStreak=streak;
    const ms={5:25,10:50,15:75};
    if(ms[streak]&&!sessionMs.has(streak)){sessionMs.add(streak);state.xp+=ms[streak];gain+=ms[streak];toast(`🔥 ${streak}er-Serie! +${ms[streak]} Bonus-XP`);fx.mega(streak);}
    else fx.burst(streak);
    flyXP(gain);
  }else streak=0;
  saveProgress();refreshHeader();
  return gain;
}

function ensureIds(c){

  c.topics.forEach(t=>{

    t.cards=(t.cards||[]).map(card=>{

      if(!card.id)card.id="c"+rid();

    t.questions=(t.questions||[]).map(q=>{ if(!q.id)q.id="q"+rid(); return q; });
  });
  return c;
}

/* ============================================================
   DATEN-ZUGRIFF
   ============================================================ */
function topicById(id){return content.topics.find(t=>t.id===id);}
function allCards(){const o=[];content.topics.forEach(t=>t.cards.forEach(c=>o.push({topic:t.id,id:c.id,term:c.term,def:c.def})));return o;}

function buildPool(topicId){
  const pool=[];
  const ts=topicId==="all"?content.topics:content.topics.filter(t=>t.id===topicId);
  ts.forEach(t=>(t.questions||[]).forEach(h=>{
    if(h.type==="mc")pool.push({type:"mc",q:h.q,options:h.options.slice(),answer:h.answer,ex:h.ex||""});
    else pool.push({type:"fill",q:h.q,accept:(h.accept||[]).slice(),sol:h.sol||"",ex:h.ex||""});
  }));
  if(content.autoCards){
    const scope=allCards().filter(c=>topicId==="all"||c.topic===topicId);
    const others=allCards();
    scope.forEach(c=>{
      if(others.length>=4){
        const dA=shuffle(others.filter(o=>o.id!==c.id)).slice(0,3).map(o=>o.def);
        const oA=shuffle([c.def,...dA]);pool.push({type:"mc",q:"Was bedeutet: „"+c.term+"“?",options:oA,answer:oA.indexOf(c.def),ex:""});
        const dB=shuffle(others.filter(o=>o.id!==c.id)).slice(0,3).map(o=>o.term);
        const oB=shuffle([c.term,...dB]);pool.push({type:"mc",q:"Welcher Begriff wird beschrieben?  „"+c.def+"“",options:oB,answer:oB.indexOf(c.term),ex:""});
      }
    });
  }
  return shuffle(pool);
}

function startQuiz(topicId){
  const pool=buildPool(topicId);
  if(!pool.length){alert("Für dieses Thema gibt es noch keine Fragen.");return;}
  qz={topicId,qs:pool.slice(0,Math.min(10,pool.length)),i:0,correct:0,gained:0,locked:false};sessionMs=new Set();go("quiz");

  else body=`<div class="fillbox"><input id="fillIn" type="text" autocomplete="off" placeholder="Antwort eintippen …" onkeydown="if(event.key==='Enter')answerFill()"><button class="btn" id="fillBtn" onclick="answerFill()">Prüfen</button></div>`;

  if(q.type==="fill")setTimeout(()=>$("fillIn")&&$("fillIn").focus(),60);

function answerMC(i){
  if(qz.locked)return;qz.locked=true;const q=qz.qs[qz.i];const ok=i===q.answer;
  for(let k=0;k<q.options.length;k++){const el=$("opt"+k);el.disabled=true;if(k===q.answer)el.classList.add("correct");}
  if(!ok)$("opt"+i).classList.add("wrong");
  resolve(ok,q,q.options[q.answer]);
}
function answerFill(){
  if(qz.locked)return;const q=qz.qs[qz.i];const inp=$("fillIn");const val=norm(inp.value);if(!val){inp.focus();return;}
  qz.locked=true;inp.disabled=true;$("fillBtn").disabled=true;
  const ok=(q.accept||[]).some(a=>{const n=norm(a);return n&&(val===n||(val.length>=3&&(val.includes(n)||n.includes(val))));});
  inp.classList.add(ok?"correct":"wrong");resolve(ok,q,q.sol);
}
let sessionMs=new Set();
function resolve(ok,q,solText){
  const gain=applyScore(ok,q.type==="fill"?15:10);
  if(ok){state.quiz.correct++;qz.correct++;qz.gained+=gain;}
  state.quiz.answered++;saveProgress();refreshHeader();
  const fb=$("fb");fb.className="feedback show "+(ok?"ok":"no");
  fb.innerHTML=`<div class="fh"><span>${ok?"✓ Richtig!":"✗ Nicht ganz"}</span>${ok?`<span class="xp">+${gain} XP</span>`:""}</div>${ok?(q.ex?`<div class="sol">${escHtml(q.ex)}</div>`:""):`<div class="sol">Richtige Antwort: <b>${escHtml(solText||"")}</b>${q.ex?" — "+escHtml(q.ex):""}</div>`}`;
  const last=qz.i>=qz.qs.length-1;
  $("foot").innerHTML=`<button class="btn" onclick="nextQ()">${last?"Auswertung ›":"Weiter ›"}</button>`;
}

let edQ=null;

function renderQForm(arg){
  // Aufruf aus Liste über go('edQForm',{tid,qid}) -> erst Edit laden

     <button class="${isMc?'on':''}" onclick="edQSwitch('mc')">🔘 Multiple Choice</button>

      <div class="field"><label>Antwortmöglichkeiten — Punkt = richtige Antwort</label>
        ${edQ.options.map((o,i)=>`<div class="opt-edit"><input type="radio" name="qf_ans" ${i===edQ.answer?"checked":""} onchange="edQ.answer=${i}">
          <input class="inp" id="qf_o${i}" value="${escAttr(o)}" placeholder="Option ${i+1}">
          ${edQ.options.length>2?`<button class="rm" title="Entfernen" onclick="edQRmOpt(${i})">✕</button>`:""}</div>`).join("")}

  }else{
    block=`<div class="field"><label>Frage / Satz mit Lücke</label><textarea id="qf_q" placeholder="Schreibe ___ für die Lücke, z. B.: Der Höhepunkt heißt ___.">${escHtml(edQ.q)}</textarea></div>
      <div class="field"><label>Akzeptierte Antworten (eine pro Zeile)</label><textarea id="qf_acc" placeholder="drop&#10;der drop">${escHtml((edQ.accept||[]).join("\n"))}</textarea></div>
      <div class="field"><label>Anzeige-Lösung (wird als richtige Antwort gezeigt)</label><input type="text" id="qf_sol" value="${escAttr(edQ.sol||"")}" placeholder="z. B. Drop"></div>
      <div class="field"><label>Erklärung (optional)</label><input type="text" id="qf_ex" value="${escAttr(edQ.ex||"")}" placeholder="optional"></div>`;
  }
  $("app").innerHTML=`<div class="screen"><button class="backlink" onclick="go('edQs','${edQ.tid}')">‹ Zurück zu den Fragen</button>
    <div class="eyebrow">${edQ.id?"Frage bearbeiten":"Neue Frage"}</div><h2 class="title">${isMc?"Multiple Choice":"Lückentext"}</h2>
    ${typeBlock}${block}
    <div class="form-actions"><button class="btn" onclick="edQSave()">✓ Speichern</button><button class="btn ghost" onclick="go('edQs','${edQ.tid}')">Abbrechen</button></div></div>`;
}
function syncQForm(){
  if(!$("qf_q"))return;
  edQ.q=$("qf_q").value;
  edQ.ex=$("qf_ex")?$("qf_ex").value:"";
  if(edQ.type==="mc"){edQ.options=edQ.options.map((_,i)=>$("qf_o"+i)?$("qf_o"+i).value:"");}
  else{edQ.accept=$("qf_acc").value.split("\n").map(s=>s.trim()).filter(Boolean);if(!edQ.accept.length)edQ.accept=[""];edQ.sol=$("qf_sol").value;}
}
function edQSwitch(type){syncQForm();edQ.type=type;if(type==="mc"&&(!edQ.options||edQ.options.length<2))edQ.options=["","","",""];if(type==="fill"&&(!edQ.accept))edQ.accept=[""];renderQForm();}
function edQAddOpt(){syncQForm();edQ.options.push("");renderQForm();}
function edQRmOpt(i){syncQForm();edQ.options.splice(i,1);if(edQ.answer>=edQ.options.length)edQ.answer=0;else if(edQ.answer>i)edQ.answer--;renderQForm();}
function edQSave(){
  syncQForm();
  if(!edQ.q.trim()){alert("Bitte eine Frage eingeben.");return;}
  const t=topicById(edQ.tid);let obj;
  if(edQ.type==="mc"){
    const opts=edQ.options.map(o=>o.trim()).filter(Boolean);
    if(opts.length<2){alert("Bitte mindestens 2 Antwortmöglichkeiten ausfüllen.");return;}
    // answer-Index an gefilterte Liste anpassen
    let correctText=edQ.options[edQ.answer];if(!correctText||!correctText.trim())correctText=opts[0];
    const ans=Math.max(0,opts.indexOf(correctText.trim()));
    obj={id:edQ.id||"q"+rid(),type:"mc",q:edQ.q.trim(),options:opts,answer:ans,ex:(edQ.ex||"").trim()};
  }else{
    const acc=(edQ.accept||[]).map(a=>a.trim()).filter(Boolean);
    if(!acc.length){alert("Bitte mindestens eine akzeptierte Antwort eingeben.");return;}
    obj={id:edQ.id||"q"+rid(),type:"fill",q:edQ.q.trim(),accept:acc,sol:(edQ.sol||acc[0]).trim(),ex:(edQ.ex||"").trim()};
  }
  if(edQ.id){const idx=t.questions.findIndex(x=>x.id===edQ.id);t.questions[idx]=obj;}else t.questions.push(obj);
  saveContent();toast("Frage gespeichert");go("edQs",edQ.tid);
}

/* ============================================================
   NOTEN-TRAINER  (Violin- & Bassschlüssel · Stammtöne + Vorzeichen)
   - Tonnamen mit deutscher Oktavbezeichnung (H statt B; B = Hes)
   - Mastery-Schwelle 80% zum Freischalten der nächsten Runde
   ============================================================ */
const MASTERY=0.8;
const LET=["C","D","E","F","G","A","H"];
const LET_SEMI=[0,2,4,5,7,9,11];
function octMark(oct){return oct===4?"′":oct===5?"″":oct===6?"‴":"";}
function noteName(li,oct,acc){
  let base=LET[li];
  if(acc===1)base=base+"is";                       // Cis,Dis,Fis,Gis,Ais
  else if(acc===-1){const F={D:"Des",E:"Es",G:"Ges",A:"As",H:"B"};base=F[LET[li]]||base+"es";}
  if(oct>=3)base=base.charAt(0).toLowerCase()+base.slice(1);
  return base+octMark(oct);
}
function buildNote(li,oct,acc,clef){
  const midi=(oct+1)*12+LET_SEMI[li]+acc;
  const name=noteName(li,oct,acc);
  const o={li,oct,acc,clef,midi,name,id:clef+"_"+li+"_"+oct+"_"+acc,enh:[name]};
  if(acc!==0){let pli=acc===1?li+1:li-1,pacc=-acc;if(pli>=0&&pli<=6)o.enh=[name,noteName(pli,oct,pacc)];}
  return o;
}

    s+= up?`<line x1="${cx+8}" y1="${cy-1}" x2="${cx+8}" y2="${cy-36}" class="stem"/>`:`<line x1="${cx-8}" y1="${cy+1}" x2="${cx-8}" y2="${cy+36}" class="stem"/>`;
    if(n.acc!==0)s+=accSVG(n.acc,cx,cy);
    s+=`<ellipse cx="${cx}" cy="${cy}" rx="8" ry="5.6" transform="rotate(-20 ${cx} ${cy})" class="head"/>`;
  }

}
function buildKeys(lo,hi){const isB=m=>[1,3,6,8,10].includes(((m%12)+12)%12);
  const whites=[],blacks=[];let wi=0;
  for(let m=lo;m<=hi;m++){if(isB(m))blacks.push({midi:m,after:wi-1});else{whites.push({midi:m,i:wi});wi++;}}
  return {whites,blacks,W:wi};
}
function keyboardHTML(lo,hi,opts){opts=opts||{};const k=buildKeys(lo,hi);const bw=100/k.W*0.62;
  let h=`<div class="kbdscroll"><div class="kbd" style="min-width:${k.W*40}px"><div class="wrow">`;
  k.whites.forEach(w=>{const hl=opts.highlight===w.midi?" hl":"";const cl=opts.clickable?' onclick="noteAnsKey(this)"':" disabled";
    h+=`<button class="wk${hl}" data-midi="${w.midi}"${cl}><span class="kdot"></span></button>`;});
  h+='</div><div class="brow">';
  k.blacks.forEach(b=>{const hl=opts.highlight===b.midi?" hl":"";const cl=opts.clickable?' onclick="noteAnsKey(this)"':" disabled";
    h+=`<button class="bk${hl}" data-midi="${b.midi}" style="left:${((b.after+1)/k.W*100)-bw/2}%;width:${bw}%"${cl}></button>`;});
  return h+'</div></div>';
}
function nameOptsHTML(target,pool){
  const ex=new Set(target.enh);
  const seen=new Set([target.name]);const ds=[];
  for(const n of shuffle(pool)){if(ex.has(n.name)||seen.has(n.name))continue;seen.add(n.name);ds.push(n.name);if(ds.length>=3)break;}
  const opts=shuffle([target.name,...ds]);
  return '<div class="namepad" id="ntans">'+opts.map(nm=>`<button class="np" data-name="${escAttr(nm)}" onclick="noteAnsName(this)">${escHtml(nm)}</button>`).join("")+'</div>';
}
function staffOptsHTML(target,pool,byMidi){
  const cl=pool.filter(n=>n.clef===target.clef);
  const seen=new Set([target.id]);const ds=[];
  for(const n of shuffle(cl)){if(seen.has(n.id))continue;if(byMidi&&n.midi===target.midi)continue;seen.add(n.id);ds.push(n);if(ds.length>=3)break;}
  const opts=shuffle([target,...ds]);
  return '<div class="staffopts" id="ntans">'+opts.map(n=>`<button class="sopt" data-id="${n.id}" data-midi="${n.midi}" onclick="noteAnsNote(this)">${staffSVG(n)}</button>`).join("")+'</div>';
}
function notePanel(inner,cls){return `<div class="note-panel ${cls||''}">${inner}</div>`;}

/* ---- Tonvorräte ---- */
const POOL={};
function genNat(loDs,hiDs,clef){const a=[];for(let ds=loDs;ds<=hiDs;ds++)a.push(buildNote(ds%7,Math.floor(ds/7),0,clef));return a;}
function genAcc(octs,clef){const a=[],sh=[0,1,3,4,5],fl=[1,2,4,5,6];
  octs.forEach(o=>{sh.forEach(li=>a.push(buildNote(li,o,1,clef)));fl.forEach(li=>a.push(buildNote(li,o,-1,clef)));});return a;}
function initPools(){
  POOL.trebleNat=genNat(3*7+5,5*7+5,"G");   // a (A3) .. a'' (A5)
  POOL.trebleAcc=genAcc([4,5],"G");          // Vorzeichen, ein-/zweigestrichen
  POOL.bassNat=genNat(2*7+0,4*7+0,"F");      // C (große) .. c' (mittleres C)
  POOL.bassAcc=genAcc([2,3],"F");
  POOL.all=[].concat(POOL.trebleNat,POOL.trebleAcc,POOL.bassNat,POOL.bassAcc);
}
function kbRange(pool){let lo=999,hi=-999;pool.forEach(n=>{lo=Math.min(lo,n.midi);hi=Math.max(hi,n.midi);});
  return [lo-(lo%12), hi+((12-(hi%12))%12)];}

const ALL6=["noteName","nameNote","nameKey","keyName","noteKey","keyNote"];
const NOTE_ROUNDS=[
 {id:"t1a",grp:1,label:"Note → Name",pool:"trebleNat",dirs:["noteName"],desc:"Lies die Note (Violinschlüssel) und nenne den Namen."},
 {id:"t1b",grp:1,label:"Name → Note",pool:"trebleNat",dirs:["nameNote"],desc:"Wähle zum Namen die richtige Note."},
 {id:"t1m",grp:1,label:"Level 1 – gemischt",pool:"trebleNat",dirs:["noteName","nameNote"],mix:true,desc:"Note ↔ Name, Richtung zufällig."},
 {id:"t2a",grp:2,label:"Name → Taste",pool:"trebleNat",dirs:["nameKey"],desc:"Finde die Taste zum Notennamen."},
 {id:"t2b",grp:2,label:"Taste → Name",pool:"trebleNat",dirs:["keyName"],desc:"Benenne die markierte Taste."},
 {id:"t2m",grp:2,label:"Level 2 – gemischt",pool:"trebleNat",dirs:["nameKey","keyName"],mix:true,desc:"Name ↔ Taste, Richtung zufällig."},
 {id:"t3a",grp:3,label:"Note → Taste",pool:"trebleNat",dirs:["noteKey"],desc:"Finde die Taste zur geschriebenen Note."},
 {id:"t3b",grp:3,label:"Taste → Note",pool:"trebleNat",dirs:["keyNote"],desc:"Wähle die Note zur markierten Taste."},
 {id:"t3m",grp:3,label:"Level 3 – gemischt",pool:"trebleNat",dirs:["noteKey","keyNote"],mix:true,desc:"Note ↔ Taste, Richtung zufällig."},
 {id:"v1",grp:4,label:"Vorzeichen: Note → Name",pool:"trebleAcc",dirs:["noteName"],desc:"♯/♭ lesen und benennen (z. B. fis′ oder des″)."},
 {id:"v2",grp:4,label:"Vorzeichen: Name → Taste",pool:"trebleAcc",dirs:["nameKey"],desc:"Finde die passende schwarze Taste."},
 {id:"vm",grp:4,label:"Vorzeichen – gemischt",pool:"trebleAcc",dirs:ALL6,mix:true,desc:"Alle sechs Richtungen, mit Vorzeichen."},
 {id:"b1",grp:5,label:"Bass: Note → Name",pool:"bassNat",dirs:["noteName"],desc:"Bassschlüssel lesen und benennen."},
 {id:"b2",grp:5,label:"Bass: Note → Taste",pool:"bassNat",dirs:["noteKey"],desc:"Bassschlüssel – finde die Taste."},
 {id:"bm",grp:5,label:"Bass – gemischt",pool:"bassNat",dirs:ALL6,mix:true,desc:"Alle sechs Richtungen, Bassschlüssel."},
 {id:"fin",grp:6,label:"Finale – alles gemischt",pool:"all",dirs:ALL6,mix:true,finale:true,desc:"Beide Schlüssel, mit & ohne Vorzeichen, alles zufällig."}
];
const GRP={1:"Level 1 · Violinschlüssel – Note & Name",2:"Level 2 · Violinschlüssel – Name & Taste",3:"Level 3 · Violinschlüssel – Note & Taste",4:"Level 4 · Vorzeichen (♯/♭)",5:"Level 5 · Bassschlüssel",6:"Finale"};
const DIR_LABEL={noteName:"Welcher Notenname ist das?",nameNote:"Welche geschriebene Note gehört dazu?",nameKey:"Welche Taste gehört zu diesem Notennamen?",keyName:"Wie heißt diese Taste?",noteKey:"Welche Taste gehört zu dieser Note?",keyNote:"Welche geschriebene Note gehört zu dieser Taste?"};

let nt={},noteFreeAll=false;
function notePassed(id){const p=state.noteProgress&&state.noteProgress[id];return !!(p&&p.best>=MASTERY-1e-9);}
function noteUnlocked(idx){if(noteFreeAll||idx===0)return true;return notePassed(NOTE_ROUNDS[idx-1].id);}
function noteToggleFree(){noteFreeAll=!noteFreeAll;renderNoteHome();}

function renderNoteHome(){
  if(!state.noteProgress)state.noteProgress={};
  let html=`<div class="screen"><button class="backlink" onclick="go('home')">‹ Zurück</button>
    <div class="eyebrow">Noten-Trainer</div><h2 class="title">Noten lernen</h2>
    <p class="lead">Schritt für Schritt: geschriebene Note, Notenname und Klaviertaste – im Violin- und Bassschlüssel, mit und ohne Vorzeichen. Jedes Level endet mit einer gemischten Runde; ganz am Ende das große Finale. Zum Freischalten der nächsten Runde brauchst du <b>${Math.round(MASTERY*100)}%</b>.</p>`;
  let cur=0;
  NOTE_ROUNDS.forEach((r,i)=>{
    if(r.grp!==cur){cur=r.grp;html+=`<div class="section-h" style="margin-top:24px"><h3>${GRP[r.grp]}</h3></div>`;}
    const unlocked=noteUnlocked(i),prog=state.noteProgress[r.id],passed=notePassed(r.id),best=prog?Math.round(prog.best*100):0;
    const ic=r.finale?"🏆":(r.mix?"🔀":(r.pool==="bassNat"?miniGlyph(GLYPH.bass,20):(r.pool==="trebleAcc"?miniGlyph(GLYPH.sharp,22):(r.dirs[0].toLowerCase().includes("key")?"🎹":miniGlyph(GLYPH.treble,24)))));
    html+=`<button class="ed-row note-step ${unlocked?'':'locked'}" ${unlocked?`onclick="startNoteRound('${r.id}')"`:''}>
       <span class="ic">${unlocked?(passed?"✅":ic):"🔒"}</span>
       <div class="body"><b>${r.label}</b><small>${unlocked?escHtml(r.desc):"Erst die vorige Runde mit "+Math.round(MASTERY*100)+"% bestehen"}${prog?` · Bestwert ${best}%`:""}</small></div>
       ${unlocked?'<span class="np-go">▶</span>':''}</button>`;
  });
  html+=`<div class="ed-note" style="margin-top:22px">Deutsche Tonnamen mit Oktavlage: große Oktave <b>C–H</b>, kleine <b>c–h</b>, eingestrichen <b>c′–h′</b>, zweigestrichen <b>c″–h″</b>. Der Ton zwischen A und C heißt <b>H</b>; <b>B</b> ist das erniedrigte H. Vorzeichen: ♯ = „-is“ (fis), ♭ = „-es“ (ges, es, as) – das <b>H♭</b> heißt <b>B</b>. Auf der Tastatur liegt C immer links neben den zwei schwarzen Tasten.</div>
    <div style="text-align:center;margin-top:8px"><button class="backlink" onclick="noteToggleFree()">${noteFreeAll?"🔓 Übungsmodus aktiv – alle Runden frei wählbar":"Übungsmodus: alle Runden freischalten"}</button></div></div>`;
